<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — OrderTrack</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f1c2e">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    :root { --navy:#0f1c2e; --navy2:#1a2d45; --accent:#3b9ddd; --accent2:#5bb8f5; --red:#e74c3c; --text:#e8edf3; --muted:#8fa3bc; --border:rgba(255,255,255,0.08); }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--navy); color:var(--text); font-family:'DM Sans',system-ui,sans-serif; padding:16px; }
    .box { width:100%; max-width:360px; background:var(--navy2); border:1px solid var(--border); border-radius:14px; padding:28px; }
    h1 { font-size:20px; margin:0 0 4px; }
    p.sub { color:var(--muted); font-size:13px; margin:0 0 20px; }
    input[type=password] { width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--border); background:var(--navy); color:var(--text); font-size:15px; outline:none; }
    input[type=password]:focus { border-color:var(--accent2); }
    button { width:100%; margin-top:14px; padding:11px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
    button:hover { background:var(--accent2); }
    .err { color:var(--red); font-size:13px; margin-top:12px; }
  </style>
</head>
<body>
  <form class="box" method="post" action="/login">
    <h1><i class="bi bi-lock"></i> OrderTrack</h1>
    <p class="sub">Enter the password to continue</p>
    <input type="hidden" name="next" value="{{ next }}">
    <input type="password" name="password" placeholder="Password" autofocus required autocomplete="current-password">
    <button type="submit">Log in</button>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
  </form>
</body>
</html>
